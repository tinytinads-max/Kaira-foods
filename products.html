<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaira Foods | Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="topbar">
    <div class="container topbar-inner">
      <span>Made With Traditional Recipes</span>
      <div class="socials" aria-label="Social media">
         <span><img src="./images/facebook.png"></span>
        <span><img src="./images/insta.png"></span>
      </div>
    </div>
  </div>

  <div class="nav-wrap">
    <div class="container nav-inner">
      <a class="logo" href="index.html"><img src="images/inner-logo.png" alt="Kaira Foods"></a>

      <button class="hamburger" id="menuToggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="main-nav" id="mainNav">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="products.html">PRODUCTS</a>
        <a href="contact.html">CONTACT</a>
      </nav>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <img src="images/hero.jpg" alt="Kaira Foods traditional pickles">
    <div class="hero-overlay">
      <div class="container">
        <h1>Products</h1>
        <p>Rooted in tradition, made with love.</p>
      </div>
    </div>
  </section>

  <section class="products-section" id="products">
    <div class="container">
      <div class="product-toolbar">
  <div class="filters" role="tablist" aria-label="Product categories">
    <button class="filter active" data-category="all">ALL PRODUCTS</button>
    <button class="filter" data-category="pickles">PICKLES</button>
    <button class="filter" data-category="meat">MEAT PRODUCTS</button>
  </div>
</div>

      <div class="product-grid" id="productGrid"></div>
    </div>
  </section>

  <section class="trust-section">
    <div class="container trust-grid">
      <div class="trust-item">
        <div class="trust-icon"><img src="./images/leaf.png"></div>
        <div><h3>No Preservatives</h3><p>100% Natural</p></div>
      </div>
      <div class="trust-item">
        <div class="trust-icon"><img src="./images/Traditional.png"></div>
        <div><h3>Traditional Recipes</h3><p>Authentic Taste</p></div>
      </div>
      <div class="trust-item">
        <div class="trust-icon"><img src="./images/quality.png"></div>
        <div><h3>Premium Quality</h3><p>Finest Ingredients</p></div>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast">Added to cart</div>

    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer class="site-footer">

        <p>
            © 2026 Kaira Foods. All Rights Reserved.
        </p>

    </footer>

<script>
    const products = [
  {name:"Beef Idiyirachi", category:"meat", image:"images/beef-idiyirachi.jpg"},
  {name:"Lime Pickle", category:"pickles", image:"images/lemon.png"},
  {name:"Tender Mango Pickle", category:"pickles", image:"images/mango.png"},
  {name:"Roasted Dry Red Chilly", category:"pickles", image:"images/red-chilli-pickle.jpg"},
  {name:"Chicken Idiyirachi", category:"meat", image:"images/chicken-idiyerachi.jpg"},
   {name:"Beef pickle", category:"pickles", image:"images/beef-pickle.jpg"},
 {name:"Chicken pickle", category:"pickles", image:"images/chicken-pickle.jpg"},
];

const grid = document.getElementById("productGrid");
const filters = document.querySelectorAll(".filter");

const toast = document.getElementById("toast");

function renderProducts(category = "all") {
  let list = category === "all" ? [...products] : products.filter(p => p.category === category);



  grid.innerHTML = list.map(product => `
    <article class="product-card">
      <img class="product-image" src="${product.image}" alt="${product.name}">
      <div class="product-info">
        <h2 class="product-name">${product.name}</h2>
       
       
       
      </div>
    </article>
  `).join("");

  document.querySelectorAll(".add-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      toast.textContent = `${btn.dataset.name} added to cart`;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    });
  });
}

filters.forEach(button => {
  button.addEventListener("click", () => {
    filters.forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    renderProducts(button.dataset.category);
  });
});



// Responsive hamburger
const menuToggle = document.getElementById("menuToggle");
const mainNav = document.getElementById("mainNav");

menuToggle.addEventListener("click", () => {
  const open = mainNav.classList.toggle("open");
  menuToggle.classList.toggle("active", open);
  menuToggle.setAttribute("aria-expanded", open);
});

mainNav.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", () => {
    mainNav.classList.remove("open");
    menuToggle.classList.remove("active");
    menuToggle.setAttribute("aria-expanded", "false");
  });
});

renderProducts();

</script>
</body>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#9d190b;
  --dark-red:#7d210b;
  --cream:#f5e9dc;
  --cream-2:#fbf3e9;
  --line:#d8c5b2;
  --text:#24150e;
  --max:1400px;
}
html{scroll-behavior:smooth}
body{font-family:Poppins,sans-serif;color:var(--text);background:var(--cream);overflow-x:hidden;padding-top:170px}
img{display:block;max-width:100%}

/* Fixed top menu */
.site-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  background:#f8eee5;
  box-shadow:0 3px 14px rgba(60,30,15,.12);
}
a{text-decoration:none;color:inherit}
button,select{font:inherit}
.container{width:min(var(--max),calc(100% - 48px));margin:auto}

/* Top bar */
.topbar{height:35px;background:#ae0000;color:#fff}
.topbar-inner{height:100%;display:flex;align-items:center;justify-content:space-between;font-size:12px;}
.socials{display:flex;gap:10px;align-items:center}
.socials a{width:23px;height:23px;border:1.5px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px}

/* Navigation */
.nav-wrap{height:135px;background:#f8eee5}
.nav-inner{height:100%;display:flex;align-items:center;justify-content:space-between}
.logo{width:180px;display:block}
.logo img{width:100%;height:80px;object-fit:cover;object-position:center;border-radius:0;mix-blend-mode:multiply}
.main-nav{display:flex;align-items:center;gap:58px}
.main-nav a{font-size:16px;font-weight:500;transition:.2s}
.main-nav a:hover{color:var(--red);}
.hamburger{display:none;border:0;background:none;width:44px;height:44px;cursor:pointer}
.hamburger span{display:block;width:27px;height:2px;background:#2b160e;margin:6px auto;transition:.25s}

/* Hero */
.hero{position:relative;height:190px;overflow:hidden}
.hero>img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;display:flex;align-items:center;background:linear-gradient(90deg,rgba(247,220,193,.9) 0%,rgba(247,220,193,.55) 43%,rgba(247,220,193,0) 75%)}
.hero h1{font-family:"Playfair Display",serif;font-size:50px;line-height:1.05;margin-bottom:8px}
.hero p{font-size:14px}

/* Products */
.products-section{padding:47px 0 70px}
.product-toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filter{border:1px solid #7e381e;background:transparent;color:#5b2412;border-radius:4px;padding:9px 24px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.filter.active,.filter:hover{background:#8c2b0d;color:#fff}


.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px}
.product-card{background:#f8eee5;border:1px solid #d8c6b6;border-radius:8px;overflow:hidden;min-width:0;transition:transform .2s,box-shadow .2s}
.product-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(78,39,19,.12)}
.product-image{width:100%;/*height:195px*/;object-fit:cover}
.product-info{padding:8px 14px 12px;position:relative;min-height:74px}
.product-name{font-size:14px;margin-bottom:3px}
.product-weight{font-size:11px;color:#4d3a31}
.product-price{position:absolute;right:14px;top:8px;font-weight:700;color:#73210d;font-size:14px}
.add-btn{display:block;margin:9px 0 0 auto;border:0;background:#842b10;color:#fff;border-radius:3px;padding:7px 15px;font-size:10px;font-weight:600;cursor:pointer}
.add-btn:hover{background:#641c08}

/* Trust */
.trust-section{padding:35px 0 35px; border-top: solid 1px #ead9c7; background: #fdf5ec;}
.trust-grid{display:grid;grid-template-columns:repeat(3,1fr);max-width:1100px}
.trust-item{display:flex;align-items:center;justify-content:center;gap:15px;padding:12px 30px;border-right:1px solid #dac7b6}
.trust-item:last-child{border-right:0}
.trust-icon{font-size:34px;line-height:1}
.trust-item h3{font-size:14px;margin-bottom:3px}
.trust-item p{font-size:11px;line-height:1.5}

/* Toast */
.toast{position:fixed;right:22px;bottom:22px;background:#7e260d;color:#fff;padding:12px 20px;border-radius:5px;font-size:13px;opacity:0;transform:translateY(15px);pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:translateY(0)}

        /* =====================================================
           FOOTER
        ===================================================== */

        .site-footer {
            width: 100%;

            background: #863600;

            color: #fff;
            height: 35px;
            line-height: 35px;
                text-align: center;
        }

        .site-footer p {
            font-size: 12px;
        }

/* Tablet */
@media (max-width:1100px){
  .main-nav{gap:30px}
  .product-grid{grid-template-columns:repeat(3,1fr)}
  .trust-grid{grid-template-columns:1fr}
  .trust-item{border-right:0;border-bottom:1px solid #dac7b6;justify-content:flex-start}
  .trust-item:last-child{border-bottom:0}
}

/* Mobile */
@media (max-width:767px){
  body{padding-top:118px}
 .container {
    width: min(100% - 28px, var(--max));
  }
  .topbar{height:35px}
  .topbar-inner{font-size:11px}
  .socials{gap:10px}
  .socials a{width:19px;height:19px;font-size:12px}

  .nav-wrap{height:82px}
  .logo{width:145px}
  .logo img{height:65px}
  
 .main-nav {
    position: fixed;
    z-index: 1001;

    top: 117px;
    right: 0;
    left: 0;

    width: 100%;
    height: calc(100vh - 117px);

    background: #f8eee5;

    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;

    /* Hidden to the right */
    transform: translateX(100%);
    opacity: 0;

    transition:
      transform 0.4s ease,
      opacity 0.3s ease;

    overflow-y: auto;
  }

  /* Menu open */
  .main-nav.open {
    transform: translateX(0);
    opacity: 1;
    text-align: center;
  }
  /* Menu links */
  .main-nav a {
    padding: 18px 25px;
    border-bottom: 1px solid #e0cec0;
    font-size: 15px;
    font-weight: 600;
  }
   .main-nav a:hover {
    background: #ead8c8;
    color: var(--red);
  }
    .hamburger {
    display: block;
    position: relative;
    z-index: 1002;
    width: 44px;
    height: 44px;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  .hamburger span {
    display: block;
    width: 27px;
    height: 2px;
    background: #2b160e;
    margin: 6px auto;
    transition: 0.3s ease;
  }
    .hamburger.active span:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
  }

  .hamburger.active span:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
  }

  .hero{height:175px}
  .hero h1{font-size:43px}
  .hero p{font-size:14px}

  .products-section{padding:28px 0}
  .product-toolbar{align-items:stretch;flex-direction:column}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .filter{padding:10px 8px;font-size:10px}
  .filter:last-child{grid-column:1/-1}

  .product-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .product-image{height:145px}
  .product-info{padding:8px 9px 10px;min-height:91px}
  .product-name{font-size:12px;max-width:75%}
  .product-price{right:9px;top:8px;font-size:12px}
  .product-weight{font-size:10px}
  .add-btn{font-size:9px;padding:7px 10px;margin-top:9px}
  .trust-section{padding-bottom:25px}
  .trust-item{padding:14px 5px}
}

@media (max-width:430px){
  .product-grid{grid-template-columns:1fr}
  .product-image{height:190px}
  .product-info{min-height:82px}
  .hero{height:160px}
  .hero h1{font-size:38px}
}

</style>
</html>
